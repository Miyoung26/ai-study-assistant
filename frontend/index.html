<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 학습시간 AI 비서</title><link rel="stylesheet" href="style.css"></head><body><header><h1>📚 나의 학습시간 AI 비서</h1><p>120일 학습 기록을 분석하고 질문해 보세요.</p></header><main><section class="card summary"><h2>데이터 요약</h2><div id="summary">불러오는 중...</div></section><section class="card"><h2>AI 채팅</h2><div id="messages"></div><form id="chatForm"><input id="messageInput" placeholder="예: 최근 학습 추세를 알려줘" required><button>전송</button></form><div id="loading" hidden>AI가 분석 중입니다...</div></section><section class="card"><h2>데이터 관리</h2><form id="dataForm"><input id="date" type="date" required><input id="value" type="number" min="0" max="1440" placeholder="학습시간(분)" required><input id="memo" maxlength="200" placeholder="메모"><button>추가</button></form><div class="table-wrap"><table><thead><tr><th>날짜</th><th>분</th><th>메모</th><th>관리</th></tr></thead><tbody id="dataList"></tbody></table></div></section><section class="card"><h2>대화 기록</h2><div id="conversations"></div></section></main><script src="config.js"></script><script src="app.js"></script></body></html>
